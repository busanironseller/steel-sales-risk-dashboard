name: Daily email digest

on:
  schedule:
    # 21:00 UTC = 06:00 KST 예약. GitHub 크론 실측 지연(~50분) + 데이터 갱신(~10분)을
    # 감안하면 실제 도착은 매일 아침 약 07:00 KST.
    - cron: '0 21 * * *'
  workflow_dispatch:          # 수동 실행도 가능

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Refresh data first so the digest uses the latest
      - name: Refresh data with AI analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run refresh
        timeout-minutes: 12
        continue-on-error: true   # 데이터 갱신 실패해도 이메일은 발송

      - name: Send digest email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: node scripts/send-digest.mjs
