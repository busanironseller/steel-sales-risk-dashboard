name: Daily email digest

on:
  schedule:
    # 21:50 UTC = 06:50 KST 예약. GitHub 크론 실측 지연(~50분) + 데이터 갱신(~10분)을
    # 감안해 실제 메일 도착을 매일 아침 약 07:50 KST에 맞춤.
    - cron: '50 21 * * *'
  workflow_dispatch:          # 수동 실행도 가능
    inputs:
      use_extra_recipient:
        description: 'DIGEST_TO 대신 DIGEST_TO_EXTRA(보조 수신자 시크릿)로 발송'
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Refresh data first so the digest uses the latest
      - name: Refresh data with AI analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run refresh
        timeout-minutes: 12
        continue-on-error: true   # 데이터 갱신 실패해도 이메일은 발송

      - name: Send digest email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ inputs.use_extra_recipient == true && secrets.DIGEST_TO_EXTRA || secrets.DIGEST_TO }}
        run: node scripts/send-digest.mjs
