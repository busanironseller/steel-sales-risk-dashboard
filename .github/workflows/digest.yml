name: Daily email digest

on:
  schedule:
    # 21:50 UTC = 06:50 KST 예약. GitHub 크론 실측 지연(~50분) + 데이터 갱신(~10분)을
    # 감안해 실제 메일 도착을 매일 아침 약 07:50 KST에 맞춤.
    - cron: '50 21 * * *'
  workflow_dispatch:          # 수동 실행도 가능

# 수집한 데이터를 커밋해야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Refresh data first so the digest uses the latest
      - name: Refresh data with AI analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run refresh
        timeout-minutes: 12
        continue-on-error: true   # 데이터 갱신 실패해도 이메일은 발송

      # 수집 결과를 커밋해 두지 않으면 메일에만 담기고 버려져서, 웹 대시보드가
      # 메일보다 오래된 데이터를 계속 보여주게 된다(발산). 커밋해 두면 뒤이어
      # 도는 배포가 이 데이터를 사이트에 반영한다.
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "data: digest refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push

      - name: Send digest email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_TO_EXTRA: ${{ secrets.DIGEST_TO_EXTRA }}
        run: node scripts/send-digest.mjs
