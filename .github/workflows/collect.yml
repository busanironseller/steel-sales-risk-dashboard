name: Scheduled data collection

on:
  schedule:
    # Every 30 minutes, all day, every day. News and geopolitical events happen
    # outside SHFE hours; the user checks the dashboard in KST mornings too.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh data with AI analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run refresh
        timeout-minutes: 12
        continue-on-error: true   # AI 분석 실패/타임아웃해도 수집된 데이터는 커밋

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          # Nothing to do when the market is closed and no feed moved.
          if git diff --staged --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "data: scheduled refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
