name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # A push made with the default GITHUB_TOKEN does not trigger other workflows,
  # so the scheduled collector's data commit would never reach the site. Chaining
  # off the collector's completion instead — workflow_run is not subject to that
  # loop-prevention rule.
  workflow_run:
    workflows: ['Scheduled data collection']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress must stay FALSE here. With `true`, every new trigger
# (hourly collector chain + any push) killed the deploy already in flight —
# observed on 2026-08-24 as three consecutive cancelled deploys leaving the
# site stale for hours. With `false`, an in-flight deploy always completes,
# and GitHub keeps only the LATEST pending run in the queue (older pending
# runs are superseded), so the newest build still wins without cancelling
# work in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Normal successful runs take 12-14 min (refresh ~10 + build ~2).
    # 25 min leaves ~2x headroom while stopping a hung refresh from
    # blocking the queue for an hour.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Collect fresh data at build time so a deploy never ships a stale snapshot.
      # A collector failure must not block the deploy: the committed data is used
      # instead and the dashboard's own freshness indicator shows how old it is.
      - name: Refresh market and news data
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run refresh

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
