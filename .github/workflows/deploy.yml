name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # A push made with the default GITHUB_TOKEN does not trigger other workflows,
  # so the scheduled collector's data commit would never reach the site. Chaining
  # off the collector's completion instead — workflow_run is not subject to that
  # loop-prevention rule.
  workflow_run:
    workflows: ['Scheduled data collection']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Collect fresh data at build time so a deploy never ships a stale snapshot.
      # A collector failure must not block the deploy: the committed data is used
      # instead and the dashboard's own freshness indicator shows how old it is.
      - name: Refresh market and news data
        continue-on-error: true
        run: npm run refresh

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
